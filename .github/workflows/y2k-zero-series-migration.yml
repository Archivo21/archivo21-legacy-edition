name: Y2K zero-series identity migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/y2k-zero-series-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace exact legacy identity literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "A21-HUM-001": "A21-HUM-000",
              "A21-AI-001": "A21-AI-000",
          }
          root = Path('.')
          changed = []

          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = data
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_text(updated, encoding='utf-8', newline='')
                  changed.append(str(path))

          # Rename current paths only when the exact institutional literal appears.
          paths = sorted(
              [p for p in root.rglob('*') if '.git' not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for path in paths:
              new_name = path.name.replace('A21-HUM-001', 'A21-HUM-000').replace('A21-AI-001', 'A21-AI-000')
              if new_name != path.name:
                  target = path.with_name(new_name)
                  path.rename(target)
                  changed.append(f'{path} -> {target}')

          workflow = Path('.github/workflows/y2k-zero-series-migration.yml')
          if workflow.exists():
              workflow.unlink()
              changed.append(str(workflow) + ' (self-removed)')

          report = Path('/tmp/a21-y2k-migration-files.txt')
          report.write_text('\n'.join(changed) + ('\n' if changed else ''), encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          PY
      - name: Commit migration to main
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes were required."
            exit 0
          fi
          git config user.name "A21-AI-000"
          git config user.email "archivo21@users.noreply.github.com"
          git add -A
          git commit -m "Y2K: migrate legacy institutional identities to zero series"
          git push origin HEAD:main
