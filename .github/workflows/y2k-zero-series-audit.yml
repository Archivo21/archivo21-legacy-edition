name: Y2K zero-series identity audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/y2k-zero-series-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact legacy literals and path names are absent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path('.')
          audit_path = Path('.github/workflows/y2k-zero-series-audit.yml')
          forbidden = ('A21-HUM-' + '001', 'A21-AI-' + '001')
          findings = []

          for path in sorted(root.rglob('*')):
              if '.git' in path.parts or path == audit_path:
                  continue
              if any(token in path.name for token in forbidden):
                  findings.append(f'PATH {path}')
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for token in forbidden:
                  if token in text:
                      findings.append(f'CONTENT {token} {path}')

          if findings:
              print('\n'.join(findings))
              sys.exit(1)
          print('CLEAN: exact legacy institutional literals and path names are absent from current UTF-8 repository state.')
          PY
      - name: Commit audit success and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/y2k-zero-series-audit.yml
          git config user.name "A21-AI-000"
          git config user.email "archivo21@users.noreply.github.com"
          git add -A
          git commit -m "Y2K: verify zero-series migration clean"
          git push origin HEAD:main
